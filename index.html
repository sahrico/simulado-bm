<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Simulado BMRS - Sargento</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0b3c5d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
    }

    .progress {
      margin-bottom: 20px;
      font-weight: bold;
    }

    .question {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .meta {
      font-size: 13px;
      color: #666;
      margin-bottom: 15px;
    }

    .options label {
      display: block;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .options input {
      margin-right: 10px;
    }

    .correct {
      background: #d4edda;
      border-color: #28a745;
    }

    .incorrect {
      background: #f8d7da;
      border-color: #dc3545;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #0b3c5d;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .explanation {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 5px;
    }

    .hidden {
      display: none;
    }

    .result {
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>Simulado BMRS – Sargento</h1>
  <p>10 questões por dia | Baseado no edital CTSP 2026</p>
</header>

<main>
  <div id="app"></div>
</main>

<script>
/* ================================
   CONFIGURAÇÃO DE DATA
================================ */
const START_DATE = new Date("2024-12-18"); // ajuste se necessário
const TODAY = new Date();
const DAY_INDEX = Math.floor((TODAY - START_DATE) / (1000 * 60 * 60 * 24));

/* ================================
   BANCO DE QUESTÕES (EXEMPLO)
   → Aqui depois entra o banco REAL
================================ */
const questionBank = [
  {
    id: 1,
    question: "Segundo o Estatuto dos Servidores Militares do RS, o militar estadual está sujeito:",
    meta: "Legislação Institucional BMRS – Fundatec – 2022",
    options: [
      "Apenas às normas administrativas comuns",
      "À legislação civil exclusivamente",
      "Às normas disciplinares e penais militares",
      "Somente ao Código Penal comum",
      "À CLT"
    ],
    correct: 2,
    explanationCorrect: "O militar estadual está sujeito às normas disciplinares e penais militares, conforme o Estatuto dos Servidores Militares do RS.",
    explanationChosenWrong: "A alternativa escolhida ignora o regime jurídico especial aplicado aos militares.",
    explanationOthers: "As demais alternativas desconsideram o regime militar ou aplicam normas incompatíveis."
  },

  // 🔽 DUPLICADO APENAS PARA DEMONSTRAÇÃO
];

while (questionBank.length < 30) {
  questionBank.push({ ...questionBank[0], id: questionBank.length + 1 });
}

/* ================================
   SELEÇÃO DAS 10 QUESTÕES DO DIA
================================ */
function getQuestionsOfTheDay() {
  const start = DAY_INDEX * 10;
  return questionBank.slice(start, start + 10);
}

const questions = getQuestionsOfTheDay();
let current = 0;
let score = 0;
let wrongSummary = [];

/* ================================
   RENDERIZAÇÃO
================================ */
const app = document.getElementById("app");

function renderQuestion() {
  const q = questions[current];
  app.innerHTML = `
    <div class="progress">Questão ${current + 1} de ${questions.length}</div>

    <div class="question">${q.question}</div>
    <div class="meta">${q.meta}</div>

    <div class="options">
      ${q.options.map((opt, i) => `
        <label>
          <input type="radio" name="option" value="${i}">
          ${opt}
        </label>
      `).join("")}
    </div>

    <button id="answerBtn">Responder</button>
    <div id="feedback" class="explanation hidden"></div>
  `;

  document.getElementById("answerBtn").onclick = checkAnswer;
}

function checkAnswer() {
  const selected = document.querySelector('input[name="option"]:checked');
  if (!selected) return alert("Selecione uma alternativa.");

  const q = questions[current];
  const answer = Number(selected.value);
  const feedback = document.getElementById("feedback");

  document.querySelectorAll("label").forEach((label, i) => {
    if (i === q.correct) label.classList.add("correct");
    if (i === answer && i !== q.correct) label.classList.add("incorrect");
  });

  if (answer === q.correct) {
    score++;
    feedback.innerHTML = `<strong>Resposta correta.</strong><br><br>${q.explanationCorrect}`;
  } else {
    wrongSummary.push({
      question: q.question,
      correct: q.options[q.correct]
    });

    feedback.innerHTML = `
      <strong>Resposta incorreta.</strong><br><br>
      <strong>Por que a sua está errada:</strong> ${q.explanationChosenWrong}<br><br>
      <strong>Por que a correta está certa:</strong> ${q.explanationCorrect}<br><br>
      <strong>Demais alternativas:</strong> ${q.explanationOthers}
    `;
  }

  feedback.classList.remove("hidden");

  document.getElementById("answerBtn").disabled = true;

  setTimeout(() => {
    current++;
    current < questions.length ? renderQuestion() : renderResult();
  }, 3000);
}

function renderResult() {
  app.innerHTML = `
    <div class="result">
      <h2>Resultado do Dia</h2>
      <p>Você acertou <strong>${score}</strong> de <strong>${questions.length}</strong></p>
      <p>Continue firme! A constância faz diferença 💪</p>

      ${wrongSummary.length ? `
        <h3>Resumo das incorretas</h3>
        <ul>
          ${wrongSummary.map(w => `<li>${w.question}<br><strong>Correta:</strong> ${w.correct}</li>`).join("")}
        </ul>
      ` : "<p>Parabéns! Nenhuma questão errada 🎉</p>"}
    </div>
  `;
}

renderQuestion();
</script>

</body>
</html>
